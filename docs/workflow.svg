<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Onevoke 工作流</title>
  <desc id="wf-desc">新建 agent 会话讨论需求, 确认后用看板流程完成任务, 重复安排所有任务, 用命令 kanban tui 打开可视化看板关注任务进度.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#f1f4f9"/>
    </linearGradient>
    <filter id="card" x="-8%" y="-14%" width="116%" height="132%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="a-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .s { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; }
      .h1 { font-size: 38px; font-weight: 700; fill: #0f172a; }
      .h2 { font-size: 18px; fill: #64748b; }
      .tag { font-size: 15px; fill: #94a3b8; }
      .pt { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .pn { font-size: 15px; fill: #64748b; }
      .bt { font-size: 16px; fill: #334155; }
      .num { font-size: 20px; font-weight: 700; fill: #ffffff; }
      .hl { font-family: "SFMono-Regular", "Cascadia Mono", "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 16px; font-weight: 700; fill: #6d28d9; }
      .cmd { font-family: "SFMono-Regular", "Cascadia Mono", "Noto Sans Mono", "DejaVu Sans Mono", monospace; font-size: 15px; font-weight: 600; fill: #334155; }
      .panel { fill: #ffffff; stroke: #e6eaf0; stroke-width: 1.5; }
      .flow { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#a-slate); }
      .col { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .coltitle { font-size: 16px; font-weight: 700; fill: #475569; }
      .cardtitle { font-size: 14px; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <text x="64" y="70" class="s h1">Onevoke 工作流</text>
  <text x="64" y="106" class="s h2">新建会话讨论 → 确认后建卡启动 → 重复安排 → TUI 跟进</text>
  <text x="1136" y="100" text-anchor="end" class="s tag">一个人用看板调度多个 AI Agent</text>
  <line x1="64" y1="132" x2="1136" y2="132" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- step 1 -->
  <rect x="64" y="160" width="512" height="196" rx="16" class="panel" filter="url(#card)"/>
  <rect x="96" y="184" width="40" height="40" rx="12" fill="#4f46e5"/>
  <text x="116" y="211" text-anchor="middle" class="s num">1</text>
  <text x="152" y="206" class="s pt">新建会话</text>
  <text x="152" y="232" class="s pn">讨论需求</text>
  <line x1="96" y1="262" x2="544" y2="262" stroke="#eef1f6" stroke-width="1.5"/>
  <circle cx="106" cy="290" r="4" fill="#a5b4fc"/>
  <text x="122" y="295" class="s bt">说清目标与背景</text>
  <circle cx="106" cy="318" r="4" fill="#a5b4fc"/>
  <text x="122" y="323" class="s bt">定验收条件与不做的范围</text>

  <!-- step 2 -->
  <rect x="624" y="160" width="512" height="196" rx="16" class="panel" filter="url(#card)"/>
  <rect x="656" y="184" width="40" height="40" rx="12" fill="#d97706"/>
  <text x="676" y="211" text-anchor="middle" class="s num">2</text>
  <text x="712" y="206" class="s pt">确认后建卡启动</text>
  <text x="712" y="232" class="s pn">用看板流程交付</text>
  <line x1="656" y1="262" x2="1104" y2="262" stroke="#eef1f6" stroke-width="1.5"/>
  <circle cx="666" cy="290" r="4" fill="#fbbf24"/>
  <text x="682" y="295" class="s bt">需求确认才建卡</text>
  <circle cx="666" cy="318" r="4" fill="#fbbf24"/>
  <text x="682" y="323" class="s bt">每张卡独立 Agent 执行</text>

  <path d="M576 258 H624" class="flow"/>
  <path d="M760 356 V368 H320 V376" class="flow"/>
  <path d="M576 474 H624" class="flow"/>

  <!-- step 3 -->
  <rect x="64" y="376" width="512" height="196" rx="16" class="panel" filter="url(#card)"/>
  <rect x="96" y="400" width="40" height="40" rx="12" fill="#0d9488"/>
  <text x="116" y="427" text-anchor="middle" class="s num">3</text>
  <text x="152" y="422" class="s pt">重复安排</text>
  <text x="152" y="448" class="s pn">逐个落实全部需求</text>
  <line x1="96" y1="478" x2="544" y2="478" stroke="#eef1f6" stroke-width="1.5"/>
  <circle cx="106" cy="506" r="4" fill="#5eead4"/>
  <text x="122" y="511" class="s bt">多个需求重复步骤 1-2</text>
  <circle cx="106" cy="534" r="4" fill="#5eead4"/>
  <text x="122" y="539" class="s bt">一次安排一个, 并行执行</text>

  <!-- step 4 -->
  <rect x="624" y="376" width="512" height="196" rx="16" class="panel" filter="url(#card)"/>
  <rect x="656" y="400" width="40" height="40" rx="12" fill="#7c3aed"/>
  <text x="676" y="427" text-anchor="middle" class="s num">4</text>
  <text x="712" y="422" class="s pt">TUI 跟进</text>
  <text x="712" y="448" class="s pn">查看所有任务状态</text>
  <line x1="656" y1="478" x2="1104" y2="478" stroke="#eef1f6" stroke-width="1.5"/>
  <circle cx="666" cy="506" r="4" fill="#c4b5fd"/>
  <text x="682" y="511" class="s bt">只看全部任务进度, 不改卡</text>
  <rect x="656" y="522" width="330" height="34" rx="10" fill="#f5f1fe" stroke="#ddd0fb" stroke-width="1.5"/>
  <text x="674" y="545" class="cmd">kanban tui  启动看板</text>

  <!-- board preview -->
  <rect x="64" y="596" width="1072" height="164" rx="16" class="panel" filter="url(#card)"/>
  <text x="96" y="632" class="s pt">看板示意</text>
  <text x="96" y="656" class="s pn">用命令 <tspan class="hl">kanban tui</tspan> 打开可视化看板, 关注任务进度</text>

  <g>
    <rect x="96" y="668" width="188" height="72" rx="12" class="col"/>
    <text x="108" y="690" class="s coltitle">backlog</text>
    <rect x="104" y="698" width="172" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="118" y="719" class="s cardtitle">新讨论的需求</text>

    <rect x="300" y="668" width="188" height="72" rx="12" class="col"/>
    <text x="312" y="690" class="s coltitle">todo</text>
    <rect x="308" y="698" width="172" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="322" y="719" class="s cardtitle">已确认待启动</text>

    <rect x="504" y="668" width="188" height="72" rx="12" class="col"/>
    <text x="516" y="690" class="s coltitle">working</text>
    <rect x="512" y="698" width="172" height="32" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <text x="526" y="719" class="s cardtitle">Agent 执行中</text>

    <rect x="708" y="668" width="188" height="72" rx="12" class="col"/>
    <text x="720" y="690" class="s coltitle">review</text>
    <rect x="716" y="698" width="172" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="730" y="719" class="s cardtitle">等待审核合回</text>

    <rect x="912" y="668" width="188" height="72" rx="12" class="col"/>
    <text x="924" y="690" class="s coltitle">done</text>
    <rect x="920" y="698" width="172" height="32" rx="8" fill="#e7f6f4" stroke="#9fd6cf" stroke-width="1.5"/>
    <text x="934" y="719" class="s cardtitle">已交付</text>
  </g>
</svg>
