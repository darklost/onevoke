<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Onevoke 工作流</title>
  <desc id="wf-desc">新建 agent 会话讨论需求, 确认后用看板流程完成任务, 重复安排所有任务, 用 TUI 查看全部任务状态.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#f1f4f9"/>
    </linearGradient>
    <filter id="card" x="-8%" y="-14%" width="116%" height="132%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="a-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .s { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; }
      .h1 { font-size: 38px; font-weight: 700; fill: #0f172a; }
      .h2 { font-size: 18px; fill: #64748b; }
      .tag { font-size: 15px; fill: #94a3b8; }
      .pt { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .pn { font-size: 15px; fill: #64748b; }
      .bt { font-size: 16px; fill: #334155; }
      .num { font-size: 20px; font-weight: 700; fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #e6eaf0; stroke-width: 1.5; }
      .flow { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#a-slate); }
      .col { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .cmd { font-size: 15px; font-weight: 600; fill: #334155; font-family: "SFMono-Regular", "Cascadia Mono", "Noto Sans Mono", "DejaVu Sans Mono", monospace; }
      .coltitle { font-size: 16px; font-weight: 700; fill: #475569; }
      .cardtitle { font-size: 15px; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>

  <text x="64" y="80" class="s h1">Onevoke 工作流</text>
  <text x="64" y="118" class="s h2">新建会话讨论 → 确认后建卡启动 → 重复安排 → TUI 跟进</text>
  <text x="1536" y="112" text-anchor="end" class="s tag">一个人用看板调度多个 AI Agent</text>
  <line x1="64" y1="150" x2="1536" y2="150" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- step 1 -->
  <rect x="64" y="184" width="340" height="232" rx="16" class="panel" filter="url(#card)"/>
  <rect x="96" y="212" width="40" height="40" rx="12" fill="#4f46e5"/>
  <text x="116" y="239" text-anchor="middle" class="s num">1</text>
  <text x="152" y="234" class="s pt">新建会话</text>
  <text x="152" y="260" class="s pn">讨论需求</text>
  <line x1="96" y1="288" x2="372" y2="288" stroke="#eef1f6" stroke-width="1.5"/>
  <circle cx="106" cy="315" r="4" fill="#a5b4fc"/>
  <text x="122" y="320" class="s bt">说清目标与背景</text>
  <circle cx="106" cy="347" r="4" fill="#a5b4fc"/>
  <text x="122" y="352" class="s bt">定验收条件</text>
  <circle cx="106" cy="379" r="4" fill="#a5b4fc"/>
  <text x="122" y="384" class="s bt">定不做的范围</text>

  <path d="M404 300 H440" class="flow"/>

  <!-- step 2 -->
  <rect x="440" y="184" width="340" height="232" rx="16" class="panel" filter="url(#card)"/>
  <rect x="472" y="212" width="40" height="40" rx="12" fill="#d97706"/>
  <text x="492" y="239" text-anchor="middle" class="s num">2</text>
  <text x="528" y="234" class="s pt">确认后建卡启动</text>
  <text x="528" y="260" class="s pn">用看板流程交付</text>
  <line x1="472" y1="288" x2="748" y2="288" stroke="#eef1f6" stroke-width="1.5"/>
  <circle cx="482" cy="315" r="4" fill="#fbbf24"/>
  <text x="498" y="320" class="s bt">需求确认才建卡</text>
  <circle cx="482" cy="347" r="4" fill="#fbbf24"/>
  <text x="498" y="352" class="s bt">每张卡独立 Agent 执行</text>
  <circle cx="482" cy="379" r="4" fill="#fbbf24"/>
  <text x="498" y="384" class="s bt">本会话跟进结果</text>

  <path d="M780 300 H816" class="flow"/>

  <!-- step 3 -->
  <rect x="816" y="184" width="340" height="232" rx="16" class="panel" filter="url(#card)"/>
  <rect x="848" y="212" width="40" height="40" rx="12" fill="#0d9488"/>
  <text x="868" y="239" text-anchor="middle" class="s num">3</text>
  <text x="904" y="234" class="s pt">重复安排</text>
  <text x="904" y="260" class="s pn">逐个落实全部需求</text>
  <line x1="848" y1="288" x2="1124" y2="288" stroke="#eef1f6" stroke-width="1.5"/>
  <circle cx="858" cy="315" r="4" fill="#5eead4"/>
  <text x="874" y="320" class="s bt">多个需求重复步骤 1-2</text>
  <circle cx="858" cy="347" r="4" fill="#5eead4"/>
  <text x="874" y="352" class="s bt">一次安排一个任务</text>
  <circle cx="858" cy="379" r="4" fill="#5eead4"/>
  <text x="874" y="384" class="s bt">各任务卡并行执行</text>

  <path d="M1156 300 H1192" class="flow"/>

  <!-- step 4 -->
  <rect x="1192" y="184" width="344" height="232" rx="16" class="panel" filter="url(#card)"/>
  <rect x="1224" y="212" width="40" height="40" rx="12" fill="#7c3aed"/>
  <text x="1244" y="239" text-anchor="middle" class="s num">4</text>
  <text x="1280" y="234" class="s pt">TUI 跟进</text>
  <text x="1280" y="260" class="s pn">查看所有任务状态</text>
  <line x1="1224" y1="288" x2="1504" y2="288" stroke="#eef1f6" stroke-width="1.5"/>
  <circle cx="1234" cy="315" r="4" fill="#c4b5fd"/>
  <text x="1250" y="320" class="s bt">统一看全部任务进度</text>
  <circle cx="1234" cy="347" r="4" fill="#c4b5fd"/>
  <text x="1250" y="352" class="s bt">只看状态, 不在 TUI 改卡</text>
  <rect x="1224" y="366" width="280" height="34" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1242" y="389" class="cmd">kanban tui  启动看板</text>

  <!-- board preview -->
  <rect x="64" y="452" width="1472" height="268" rx="16" class="panel" filter="url(#card)"/>
  <text x="96" y="496" class="s pt">看板示意</text>
  <text x="96" y="522" class="s pn">用命令 kanban tui 打开可视化看板, 关注任务进度</text>

  <g>
    <rect x="96" y="544" width="264" height="144" rx="12" class="col"/>
    <text x="116" y="572" class="s coltitle">backlog</text>
    <rect x="116" y="588" width="224" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="132" y="611" class="s cardtitle">新讨论的需求</text>
    <rect x="116" y="632" width="224" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="132" y="655" class="s cardtitle">待确认的想法</text>

    <rect x="376" y="544" width="264" height="144" rx="12" class="col"/>
    <text x="396" y="572" class="s coltitle">todo</text>
    <rect x="396" y="588" width="224" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="412" y="611" class="s cardtitle">已确认待启动</text>

    <rect x="656" y="544" width="264" height="144" rx="12" class="col"/>
    <text x="676" y="572" class="s coltitle">working</text>
    <rect x="676" y="588" width="224" height="36" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <text x="692" y="611" class="s cardtitle">Agent 执行中</text>
    <rect x="676" y="632" width="224" height="36" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <text x="692" y="655" class="s cardtitle">Agent 执行中</text>

    <rect x="936" y="544" width="264" height="144" rx="12" class="col"/>
    <text x="956" y="572" class="s coltitle">review</text>
    <rect x="956" y="588" width="224" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="972" y="611" class="s cardtitle">等待审核合回</text>

    <rect x="1216" y="544" width="264" height="144" rx="12" class="col"/>
    <text x="1236" y="572" class="s coltitle">done</text>
    <rect x="1236" y="588" width="224" height="36" rx="8" fill="#e7f6f4" stroke="#9fd6cf" stroke-width="1.5"/>
    <text x="1252" y="611" class="s cardtitle">已交付</text>
  </g>
</svg>
